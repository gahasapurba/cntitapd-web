<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/CNT_IT_APD_LOGO_SUITE/main-apd-delivery-logomark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a101c" media="(prefers-color-scheme: dark)" />
    <title>CNT IT APD — Culture Network Team Group IT Application Delivery</title>
    <meta name="description" content="Portal Resmi Culture Network Team (CNT) Group IT Application Delivery (IT APD) Direktorat IT Bank Mandiri. Membangun sinergi, inovasi, dan budaya kerja unggul." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Same rule as src/lib/theme.ts, applied before first paint to avoid a theme flash.
      (function () {
        var theme = '';
        try { theme = localStorage.getItem('cnt_theme_choice') || ''; } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
