name: Automated Daily Supabase Backup

on:
  schedule:
    # Berjalan setiap hari pukul 02:00 WIB (19:00 UTC)
    - cron: '0 19 * * *'
  # Memungkinkan trigger backup manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Backup Script
        id: backup
        env:
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'xarcxbfgeoetyhpqsick' }}
        run: |
          node scripts/backup-db.cjs
          echo "TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload Backup as Secure Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.backup.outputs.TIMESTAMP }}
          path: backups/*.json
          retention-days: 30
