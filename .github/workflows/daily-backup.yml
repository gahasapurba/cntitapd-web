name: Automated Supabase Backup (DB & Storage)

on:
  schedule:
    # 1. Eksekusi terjadwal sistem setiap hari pukul 02:00 WIB (19:00 UTC)
    - cron: '0 19 * * *'
  # 2. Eksekusi otomatis di cloud saat Antigravity mengupdate skema atau seed data
  push:
    paths:
      - 'supabase_schema.sql'
      - 'supabase_seed.sql'
  # 3. Trigger manual kapan saja dari GitHub tab Actions
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Sumber pemicu eksekusi'
        required: false
        default: 'Manual User Run'

jobs:
  backup:
    name: Backup Supabase Database & Storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Trigger Source & Label
        id: meta
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "TAG=SYSTEM" >> $GITHUB_OUTPUT
            echo "LABEL=⏰ Sistem (Jadwal Otomatis 02:00 WIB)" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG=ANTIGRAVITY" >> $GITHUB_OUTPUT
            echo "LABEL=🤖 Antigravity AI (Pasca Perubahan Skema/Seed)" >> $GITHUB_OUTPUT
          else
            echo "TAG=MANUAL" >> $GITHUB_OUTPUT
            echo "LABEL=${{ github.event.inputs.trigger_source || 'Manual User' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Full Backup Script (DB + Storage)
        env:
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'xarcxbfgeoetyhpqsick' }}
          TRIGGER_TAG: ${{ steps.meta.outputs.TAG }}
          TRIGGER_LABEL: ${{ steps.meta.outputs.LABEL }}
        run: |
          node scripts/backup-db.cjs

      # Repo ini publik: artifact Actions bisa diunduh akun GitHub mana pun.
      # Karena itu backup WAJIB dienkripsi (AES-256 + PBKDF2, passphrase di secret
      # BACKUP_PASSPHRASE) dan hanya berkas terenkripsi yang diunggah.
      # Tanpa secret, workflow gagal alih-alih mengunggah data mentah.
      - name: Encrypt Backup (AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          ARCHIVE: supabase-backup-${{ steps.meta.outputs.TAG }}-${{ steps.meta.outputs.TIMESTAMP }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secret BACKUP_PASSPHRASE belum diset. Backup TIDAK diunggah agar data tidak bocor."
            exit 1
          fi
          mkdir -p encrypted
          tar -czf - backups | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -salt \
            -pass env:BACKUP_PASSPHRASE -out "encrypted/$ARCHIVE.tar.gz.enc"
          rm -rf backups
          ls -lh encrypted

      - name: Upload Encrypted Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.meta.outputs.TAG }}-${{ steps.meta.outputs.TIMESTAMP }}
          path: encrypted/*.enc
          if-no-files-found: error
          retention-days: 30
